name: Build and Test

on: 
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install libcurl development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Build main
        run: |
          make

      - name: Run Tests
        shell: /usr/bin/bash {0}
        run: | 
          make -f makefiles/RunTests.mk
          if [[ $? -eq 0 ]]; then
            echo "::error::Tests Failed"
            exit 1
          fi

          echo "::notice::Tests Passed"
          exit 0